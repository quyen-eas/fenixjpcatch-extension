<!DOCTYPE html>
<!-- Added by FenixJpCatch (Phase 2). Vietnamese welcome page; the original Yomitan setup page is /welcome.html. -->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title data-i18n="welcome.pageTitle">Chào mừng đến với FenixJpCatch</title>
    <link rel="icon" type="image/png" href="/images/icon16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/images/icon19.png" sizes="19x19">
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/images/icon38.png" sizes="38x38">
    <link rel="icon" type="image/png" href="/images/icon48.png" sizes="48x48">
    <link rel="icon" type="image/png" href="/images/icon64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="/images/icon128.png" sizes="128x128">
    <link rel="stylesheet" type="text/css" href="/css/material.css">
    <link rel="stylesheet" type="text/css" href="/css/settings.css">
    <link rel="stylesheet" type="text/css" href="/css/visibility-modifiers.css">
    <link rel="stylesheet" type="text/css" href="/css/fenix.css">
    <script src="/js/fenix/welcome-main.js" type="module"></script>
</head>
<body hidden>

<div class="content-outer"><div class="content scrollbar">
<div class="content-left"></div>
<div class="content-center">
    <span tabindex="-1" id="content-scroll-focus"></span>

    <h1 data-i18n="welcome.heading"></h1>
    <p data-i18n="welcome.subtitle"></p>

    <!-- Dictionaries -->
    <h2 data-i18n="welcome.dictionaries.heading"></h2>
    <div class="settings-group">
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-description" data-i18n="welcome.dictionaries.description"></div>
        </div></div></div>
        <div id="fenix-dictionary-list"></div>
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-description" id="fenix-dictionary-summary" role="status"></div>
        </div></div></div>
    </div>

    <!-- Usage -->
    <h2 data-i18n="usage.heading"></h2>
    <div class="settings-group">
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-label" data-i18n="usage.hover.title"></div>
            <div class="settings-item-description" data-i18n="usage.hover.description"></div>
        </div></div></div>
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-label" data-i18n="usage.audio.title"></div>
            <div class="settings-item-description" data-i18n="usage.audio.description"></div>
            <div class="settings-item-description margin-above" id="fenix-audio-note" role="status" hidden></div>
        </div></div></div>
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-label" data-i18n="usage.search.title"></div>
            <div class="settings-item-description" data-i18n="usage.search.description"></div>
        </div></div></div>
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-label" data-i18n="usage.customize.title"></div>
            <div class="settings-item-description" data-i18n="usage.customize.description"></div>
        </div></div></div>
    </div>

    <!-- Permissions (wired by the stock RecommendedPermissionsController) -->
    <h2 data-i18n="permissions.heading"></h2>
    <div class="settings-group">
        <div class="settings-item"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="permissions.sites.label"></div>
                <div class="settings-item-description" data-i18n="permissions.sites.description"></div>
            </div>
            <div class="settings-item-right">
                <label class="toggle"><input type="checkbox" id="recommended-permissions-toggle" data-origin="&lt;all_urls&gt;"><span class="toggle-body"><span class="toggle-track"></span><span class="toggle-knob"></span></span></label>
            </div>
        </div></div>
        <div class="settings-item"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="permissions.optional.label"></div>
                <div class="settings-item-description" data-i18n="permissions.optional.description"></div>
            </div>
            <div class="settings-item-right">
                <label class="toggle"><input type="checkbox" id="optional-permissions-toggle"><span class="toggle-body"><span class="toggle-track"></span><span class="toggle-knob"></span></span></label>
            </div>
        </div></div>
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="danger-text" id="permissions-disabled" data-i18n="permissions.status.disabled" hidden></div>
            <div class="success-text" id="recommended-permissions-enabled" data-i18n="permissions.status.recommended" hidden></div>
            <div class="success-text" id="full-permissions-enabled" data-i18n="permissions.status.full" hidden></div>
            <div class="danger-text" id="recommended-permissions-error" hidden></div>
        </div></div></div>
    </div>

    <!-- Coming soon -->
    <h2 data-i18n="soon.heading"></h2>
    <div class="settings-group">
        <div class="settings-item"><div class="settings-item-inner"><div class="settings-item-left">
            <div class="settings-item-label" data-i18n="soon.save.title"></div>
            <div class="settings-item-description" data-i18n="soon.save.description"></div>
        </div></div></div>
    </div>

    <!-- Links -->
    <h2 data-i18n="links.heading"></h2>
    <div class="settings-group">
        <a href="/welcome.html" rel="noopener" class="settings-item settings-item-button"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="links.yomitanSetup.title"></div>
                <div class="settings-item-description" data-i18n="links.yomitanSetup.description"></div>
            </div>
            <div class="settings-item-right open-panel-button-container">
                <button type="button" class="icon-button"><span class="icon-button-inner"><span class="icon" data-icon="material-right-arrow"></span></span></button>
            </div>
        </div></a>
        <a href="/settings.html" rel="noopener" class="settings-item settings-item-button"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="links.settings.title"></div>
                <div class="settings-item-description" data-i18n="links.settings.description"></div>
            </div>
            <div class="settings-item-right open-panel-button-container">
                <button type="button" class="icon-button"><span class="icon-button-inner"><span class="icon" data-icon="material-right-arrow"></span></span></button>
            </div>
        </div></a>
        <a href="/fenix-about.html" rel="noopener" class="settings-item settings-item-button"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="links.about.title"></div>
                <div class="settings-item-description" data-i18n="links.about.description"></div>
            </div>
            <div class="settings-item-right open-panel-button-container">
                <button type="button" class="icon-button"><span class="icon-button-inner"><span class="icon" data-icon="material-right-arrow"></span></span></button>
            </div>
        </div></a>
        <div class="settings-item"><div class="settings-item-inner">
            <div class="settings-item-left">
                <div class="settings-item-label" data-i18n="showGuide.label"></div>
            </div>
            <div class="settings-item-right">
                <label class="toggle"><input type="checkbox" data-setting="general.showGuide"><span class="toggle-body"><span class="toggle-track"></span><span class="toggle-knob"></span></span></label>
            </div>
        </div></div>
    </div>

    <div class="footer-padding"></div>
</div>
<div class="content-right"></div>
</div></div>

<template id="fenix-dictionary-row-template">
    <div class="settings-item fenix-dictionary-row"><div class="settings-item-inner settings-item-inner-wrappable">
        <div class="settings-item-left">
            <div class="settings-item-label fenix-dictionary-name"></div>
            <div class="settings-item-description fenix-dictionary-description"></div>
            <div class="fenix-dictionary-status" role="status"></div>
            <div class="progress-bar-track fenix-dictionary-progress" hidden><div class="progress-bar"></div></div>
            <div class="danger-text fenix-dictionary-error" hidden></div>
        </div>
        <div class="settings-item-right">
            <button type="button" class="fenix-dictionary-action" hidden></button>
        </div>
    </div></div>
</template>

</body>
</html>
