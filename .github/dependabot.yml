version: 2
updates:
  # Only GitHub Actions are updated automatically (weekly, one grouped PR).
  # npm dependencies are updated manually (a GPL fork stays close to upstream's lockfile).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "area/dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
