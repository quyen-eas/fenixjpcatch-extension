name: Setup
description: Setup the workspace for the CI
runs:
  using: "composite"
  steps:
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        # Modified by FenixJpCatch: pinned to 22 (the version this repo is developed with). `package.json` only says
        # ">=22", which resolves to the newest Node (24.21 at the time of writing); Playwright 1.49.1 hangs forever at
        # test discovery on Node 24 (`npx playwright test --list` never returns), which made every Playwright job time out.
        # TODO: drop the pin after upgrading @playwright/test (npm update, then verify `npx playwright test --list` on Node 24).
        node-version: "22"
        cache: npm

    - name: Restore dependencies
      id: restore-dependencies
      uses: actions/cache@v4
      with:
        path: node_modules
        key: js-depend-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

    # The lockfile resolves the `yomitan-handlebars` git dependency over ssh
    # (git+ssh://git@github.com/...). CI has no ssh key, so force https.
    - name: Use https for GitHub git dependencies
      if: steps.restore-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"

    - name: Install dependencies
      if: steps.restore-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Build third-party libraries
      shell: bash
      run: npm run build:libs
