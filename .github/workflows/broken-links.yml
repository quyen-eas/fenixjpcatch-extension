name: Broken Link Checker

permissions:
  contents: read

# runs on prs containing markdown or html changes, as well as every monday at 9 am
on:
  pull_request:
    paths:
      - "**.md"
      - "**.html"
  schedule:
    - cron: "0 9 * * 1"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build Legal
        run: npm run license-report:html
      - uses: lycheeverse/lychee-action@v2.8.0
        with:
          fail: true
          jobSummary: false
          # Modified by FenixJpCatch: lychee's default concurrency (128) trips rate limits (429 from Google/gnu.org, 503 from github.com), so
          # lower it, retry, and treat transient server answers (408/429/502/503/504) as "not broken".
          args: --exclude-path 'node_modules' --root-dir '${{ github.workspace }}/ext' --verbose --no-progress --max-concurrency 10 --max-retries 3 --retry-wait-time 5 --timeout 30 --accept '100..=103,200..=299,408,429,502,503,504' './**/*.md' './**/*.html' './**/*.rst'
